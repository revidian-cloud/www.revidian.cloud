<footer class="page-wrapper">
	<div>
		<a class="site-title" href="/"><img src="/assets/img/re-logo.svg" alt="Revidian Cloud logo">{{ .Site.Title }}</a>
		<ul class="menu h social">
		{{ range .Site.Menus.social }}
			<li><a href="{{ .URL }}" rel="me" target="_blank"><i class="fab fa-{{ .Name }}"></i></a></li>
		{{ end }}
		</ul>
	</div>
	<div>
		<h3>Links</h3>
		{{ partial "menu.html" (dict "menuID" "main" "dir" "v" "page" .) }}
	</div>
	<div>
		<h3>Linodians</h3>
		{{ partial "menu.html" (dict "menuID" "linodians" "dir" "v" "page" .) }}
	</div>
	<div>
		© {{ now.Format "2006" }} Revidian Enterprises</span>
	</div>
</footer>
